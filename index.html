<!doctype html><html lang="ru"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no"><title>NEON ARENA</title>
<style>
*{box-sizing:border-box;margin:0}
body{height:100dvh;overflow:hidden;overscroll-behavior:none;user-select:none;-webkit-user-select:none;-webkit-tap-highlight-color:transparent;background:#06020f;color:#fff;font:600 16px system-ui,Segoe UI,sans-serif;display:grid;place-items:center}
#bg{position:fixed;inset:0;z-index:0}
.s{display:none;position:relative;z-index:1;text-align:center;padding:28px 34px;border-radius:24px;background:rgba(20,10,45,.6);backdrop-filter:blur(14px);border:1px solid rgba(255,255,255,.15);box-shadow:0 0 60px rgba(150,60,255,.35);min-width:min(92vw,440px)}
.s.on{display:block}
h1{font-size:clamp(30px,6vw,60px);letter-spacing:4px;background:linear-gradient(90deg,#00e5ff,#ff3df2,#b6ff00);-webkit-background-clip:text;background-clip:text;color:transparent;filter:drop-shadow(0 0 18px #a0f);margin-bottom:10px}
input,button{font:inherit;border-radius:14px;border:1px solid #fff4;padding:12px 22px;margin:10px 0;background:#ffffff14;color:#fff;outline:0;text-align:center}
button{cursor:pointer;background:linear-gradient(90deg,#00e5ff,#a040ff);border:0;font-weight:800;box-shadow:0 0 24px #a040ff88;transition:.15s}
button:hover{transform:scale(1.06)}button:disabled{opacity:.35;transform:none}
.p{display:flex;justify-content:space-between;gap:20px;padding:10px 14px;margin:6px 0;border-radius:12px;background:#ffffff12;border-left:5px solid var(--c)}
#g{padding:6px;min-width:0}
#hud{position:absolute;top:12px;left:12px;right:12px;display:flex;gap:6px;justify-content:center;flex-wrap:wrap;pointer-events:none;z-index:2}
#hud .p{margin:0;padding:4px 10px;font-size:13px;background:#000a}
#cv{display:block;width:min(98vw,calc((100dvh - 26px)*1.6));aspect-ratio:8/5;border-radius:18px;box-shadow:0 0 50px #7a3cff88;border:1px solid #fff3;cursor:crosshair;touch-action:none;
background:linear-gradient(#0a0418e8,#0a0418e8),repeating-linear-gradient(0deg,#6a3cff 0 1px,transparent 1px 50px),repeating-linear-gradient(90deg,#6a3cff 0 1px,transparent 1px 50px)}
small{opacity:.7}#rot{display:none;font-size:13px;opacity:.8;margin-bottom:6px}@media(orientation:portrait){#rot{display:block}}input{user-select:text;-webkit-user-select:text}
</style>
<canvas id=bg></canvas>
<div class=s id=join><h1>NEON ARENA</h1><p>4 мини-игры · до 8 игроков · по сети</p><input id=nm maxlength=12 placeholder="Твой ник"><br><button id=go>ВОЙТИ</button><p id=err></p></div>
<div class=s id=lobby><h1>ЛОББИ</h1><div id=pl></div><p id=lh></p><button id=st>СТАРТ</button><br><small>10 мини-игр, в каждой партии 6 случайных<br>1 место +3, 2 место +2, 3 место +1</small></div>
<div class=s id=g><div id=rot>↻ Поверни телефон горизонтально — так удобнее</div><div id=hud></div><canvas id=cv width=800 height=500></canvas></div>
<div class=s id=res><h1 id=rt></h1><div id=rr></div><p id=rn></p></div>
<script>
const $=s=>document.querySelector(s),C=['#00e5ff','#ff3df2','#b6ff00','#ffb300','#7c4dff','#ff5252','#40ffa0','#ffffff'];
let ws,me,pls=[],host,G,pg={},parts=[],ac,mx=400,my=420;
const col=id=>C[Math.max(0,pls.findIndex(p=>p.id==id))%8];
const show=i=>document.querySelectorAll('.s').forEach(e=>e.classList.toggle('on',e.id==i));
const tx=o=>ws&&ws.readyState==1&&ws.send(JSON.stringify(o));
const mul=a=>()=>{a|=0;a=a+0x6D2B79F5|0;let t=Math.imul(a^a>>>15,1|a);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296};
function beep(f,d=.1){try{ac=ac||new AudioContext();const o=ac.createOscillator(),g=ac.createGain();o.frequency.value=f;o.type='triangle';g.gain.value=.08;g.gain.exponentialRampToValueAtTime(.001,ac.currentTime+d);o.connect(g);g.connect(ac.destination);o.start();o.stop(ac.currentTime+d)}catch{}}
const boom=(x,y,c)=>{for(let i=0;i<24;i++){const a=Math.random()*6.3,v=60+Math.random()*240;parts.push({x,y,vx:Math.cos(a)*v,vy:Math.sin(a)*v,l:1,c})}};

// фон со звёздами
const bg=$('#bg'),bx=bg.getContext('2d');let st=[];
function rs(){bg.width=innerWidth;bg.height=innerHeight;st=Array.from({length:170},()=>({x:Math.random()*bg.width,y:Math.random()*bg.height,z:Math.random()*2+.3}))}rs();onresize=rs;
(function bl(){const g=bx.createRadialGradient(bg.width/2,bg.height/2,0,bg.width/2,bg.height/2,bg.width*.7);g.addColorStop(0,'#220c4a');g.addColorStop(1,'#04010b');bx.fillStyle=g;bx.fillRect(0,0,bg.width,bg.height);bx.fillStyle='#fff';
for(const s of st){s.y=(s.y+s.z*.4)%bg.height;bx.globalAlpha=s.z/2.5;bx.fillRect(s.x,s.y,s.z,s.z)}bx.globalAlpha=1;requestAnimationFrame(bl)})();

// сеть
$('#go').onclick=()=>{const n=$('#nm').value.trim()||'Игрок'+(Math.random()*99|0);
  ws=new WebSocket((location.protocol=='https:'?'wss://':'ws://')+location.host);
  $('#err').textContent='Подключаюсь… (первый раз может быть до минуты)';ws.onopen=()=>{$('#err').textContent='';tx({t:'hello',name:n})};ws.onmessage=e=>on(JSON.parse(e.data));
  ws.onclose=()=>{show('join');$('#err').textContent='Соединение потеряно';G=null}};
$('#nm').onkeydown=e=>{if(e.key=='Enter')$('#go').click()};
$('#st').onclick=()=>tx({t:'start'});
function on(m){
  if(m.t=='me')me=m.id;
  else if(m.t=='lobby'){pls=m.players;host=m.host;
    $('#pl').innerHTML=pls.map(p=>`<div class=p style="--c:${col(p.id)}"><span>${p.name}</span><span>${p.id==host?'👑 хозяин':''}${p.id==me?' (ты)':''}</span></div>`).join('');
    $('#lh').textContent=m.phase!='lobby'?'Идёт игра — подключишься со следующей':host==me?'Ты хозяин — жми СТАРТ, когда все зашли':'Ждём, пока хозяин нажмёт СТАРТ';
    $('#st').disabled=host!=me||m.phase!='lobby';
    if(m.phase=='lobby'||$('#join').classList.contains('on'))show('lobby')}
  else if(m.t=='game'){pg={};show('g');G={...m,def:GM[m.g],t0:performance.now()+m.wait,gm:GM[m.g].f(mul(m.seed)),sent:0,fin:0,run:1}}
  else if(m.t=='prog')pg[m.id]=m;
  else if(m.t=='result'&&G){G.run=0;const f=G.def.fmt;
    $('#rt').textContent=m.final?'🏆 '+m.win+' побеждает!':G.def.n+' — итоги';
    $('#rr').innerHTML=m.rows.map((r,i)=>`<div class=p style="--c:${col(r.id)}"><span>${i+1}. ${r.name}</span><span>${r.score==null||r.score<0?'—':f(r.score)} · <b>+${r.gain}</b> · всего ${r.total}</span></div>`).join('');
    $('#rn').textContent=m.final?'Возврат в лобби через 12 сек…':'Следующая игра через 7 сек…';
    show('res');if(m.final)for(let i=0;i<5;i++)setTimeout(()=>beep(400+i*150,.25),i*150)}
}

// рисование
const cv=$('#cv'),cx=cv.getContext('2d');
const glow=(c,b=20)=>{cx.shadowColor=c;cx.shadowBlur=b};
const circ=(x,y,r,c)=>{cx.fillStyle=c;glow(c,25);cx.beginPath();cx.arc(x,y,r,0,6.3);cx.fill();cx.shadowBlur=0};
const txt=(s,x,y,sz,c='#fff')=>{cx.font=`800 ${sz}px system-ui`;cx.textAlign='center';cx.fillStyle=c;glow(c,14);cx.fillText(s,x,y);cx.shadowBlur=0};

const GM={
tap:{n:'ТАП-РАШ',h:'Попадай по целям — они быстро исчезают!',fmt:s=>s+' поп.',f(R){
  let sc=0,tg;const sp=t=>tg={x:60+R()*680,y:60+R()*380,t0:t};sp(0);
  return{score:()=>sc,
    click(x,y,t){if(Math.hypot(x-tg.x,y-tg.y)<46){sc++;boom(x,y,'#0ff');beep(450+sc*18);sp(t)}else beep(120,.15)},
    draw(t){if(t-tg.t0>1.2)sp(t);const k=(t-tg.t0)/1.2;txt(Math.ceil(G.dur-t),400,70,50,'#ffffff30');
      circ(tg.x,tg.y,46,'#ff3df2');cx.strokeStyle='#fff';cx.lineWidth=4;cx.beginPath();cx.arc(tg.x,tg.y,46+50*(1-k),0,6.3);cx.stroke()}}}},
react:{n:'РЕАКЦИЯ',h:'Жми, когда экран станет ЗЕЛЁНЫМ. Рано — штраф!',fmt:s=>(5000-s)+' мс',f(R){
  const D=[0,1,2,3,4].map(()=>1+R()*2.2);let r=0,ts=0,sh=null,tot=0,msg='',dn=false;const go=()=>ts+D[r];
  return{get done(){return dn},score:()=>Math.max(0,5000-tot|0),
    click(x,y,t){if(sh!=null||dn)return;if(t<go()){tot+=600;msg='Рано! +600 мс';beep(120,.3)}else{const ms=(t-go())*1000|0;tot+=ms;msg=ms+' мс';beep(700)}sh=t},
    draw(t){if(sh!=null&&t-sh>.9){sh=null;r++;ts=t;if(r>4)dn=true}
      const rd=!dn&&sh==null&&t>=go(),c=dn?'#333':rd?'#19c45a':sh!=null?'#2a6bff':'#d6204a';
      cx.fillStyle=c;glow(c,40);cx.fillRect(40,40,720,420);cx.shadowBlur=0;
      txt(dn?'Готово: '+tot+' мс':sh!=null?msg:rd?'ЖМИ!!!':'Жди…',400,270,64);txt('Раунд '+Math.min(r+1,5)+'/5',400,95,26)}}}},
dodge:{n:'МЕТЕОРИТЫ',h:'Води мышью/пальцем. Не дай себя задеть!',fmt:s=>(s/10).toFixed(1)+' с',f(R){
  const M=[];let q=0;for(let i=0;i<130;i++){q+=.28-i*.0011;M.push({t:q,x:R()*800,v:170+R()*150+i*1.2,r:10+R()*18})}
  const s={x:400,y:420,dead:false,sc:0};
  return{get done(){return s.dead},get x(){return s.x|0},get y(){return s.y|0},score:()=>s.sc,
    draw(t){if(!s.dead){s.x+=(Math.min(780,Math.max(20,mx))-s.x)*.25;s.y+=(Math.min(480,Math.max(20,my))-s.y)*.25;s.sc=t*10|0}
      for(const m of M){if(m.t>t)break;const y=-m.r+m.v*(t-m.t);if(y>520+m.r)continue;circ(m.x,y,m.r,'#ff7a00');
        if(!s.dead&&Math.hypot(m.x-s.x,y-s.y)<m.r+9){s.dead=true;boom(s.x,s.y,'#f55');beep(90,.5)}}
      for(const id in pg){const p=pg[id];if(p.x!=null)circ(p.x,p.y,10,p.a?col(id):'#555')}
      if(!s.dead)circ(s.x,s.y,11,col(me));else txt('💥 Ты выбыл — ждём остальных',400,250,34)}}}},
math:{n:'МАТЕМАТИКА',h:'Решай примеры: цифры внизу, ✔ — ответ',fmt:s=>s+' верно',f(R){
  const Q=[];for(let i=0;i<80;i++){const a=2+R()*18|0,b=2+R()*12|0,o=R()*3|0,x=a%10+2,y=b%9+2;
    Q.push(o==0?[a+' + '+b,a+b]:o==1?[(a+b)+' − '+b,a]:[x+' × '+y,x*y])}
  let q=0,inp='',sc=0,sk=0;const K=['1','2','3','4','5','6','7','8','9','0','Backspace','Enter'];
  return{score:()=>sc,
    key(k){if(/^\d$/.test(k))inp+=k;else if(k=='Backspace')inp=inp.slice(0,-1);
      else if(k=='Enter'){if(inp!==''&&+inp==Q[q][1]){sc++;q++;boom(400,240,'#b6ff00');beep(700)}else{sk=.3;beep(120,.2)}inp=''}},
    click(x,y){K.forEach((k,i)=>{const bx=70+i%6*110,by=255+(i/6|0)*95;if(x>bx&&x<bx+100&&y>by&&y<by+85){this.key(k);beep(300,.04)}})},
    draw(t){const o=sk>0?Math.sin(t*90)*8:0;sk=Math.max(0,sk-.016);cx.save();cx.translate(o,0);txt(Q[q][0],400,130,80);txt(inp||'?',400,215,60,'#00e5ff');cx.restore();txt(Math.ceil(G.dur-t),740,60,40,'#ffffff30');
      K.forEach((k,i)=>{const bx=70+i%6*110,by=255+(i/6|0)*95;cx.fillStyle='#ffffff14';cx.fillRect(bx,by,100,85);cx.strokeStyle='#00e5ff';glow('#00e5ff',10);cx.lineWidth=2;cx.strokeRect(bx,by,100,85);cx.shadowBlur=0;txt(k=='Backspace'?'⌫':k=='Enter'?'✔':k,bx+50,by+58,40)})}}}},
spam:{n:'ТАПАЛКА',h:'Жми по экрану как можно быстрее!',fmt:s=>s+' тапов',f(R){let sc=0,pu=0;
  return{score:()=>sc,click(x,y){sc++;pu=1;boom(x,y,col(me));beep(300+sc%20*20,.04)},
  draw(t){pu=Math.max(0,pu-.05);circ(400,250,90+pu*30,col(me));txt(sc,400,275,80);txt(Math.ceil(G.dur-t),740,60,40,'#ffffff30')}}}},
nums:{n:'ЧИСЛА',h:'Жми числа по порядку от 1 до 16',fmt:s=>(s/100|0)+'/16',f(R){
  const a=[...Array(16)].map((_,i)=>i+1);for(let i=15;i>0;i--){const j=R()*(i+1)|0;[a[i],a[j]]=[a[j],a[i]]}
  let nx=1,bad=0,tt=0;const cell=i=>[45+i%4*180,45+(i/4|0)*110];
  return{get done(){return nx>16},score:()=>(nx-1)*100+(nx>16?Math.max(0,30-tt)*3|0:0),
  click(x,y){a.forEach((v,i)=>{const[bx,by]=cell(i);if(x>bx&&x<bx+170&&y>by&&y<by+100){if(v==nx){nx++;boom(bx+85,by+50,'#0ff');beep(400+nx*25,.06)}else{bad=.3;beep(120,.1)}}})},
  draw(t){if(nx<=16)tt=t;bad=Math.max(0,bad-.016);if(nx>16)txt('Готово! Ждём остальных',400,260,48);
    a.forEach((v,i)=>{if(v<nx)return;const[bx,by]=cell(i),c=bad>0?'#ff3355':'#ff3df2';cx.fillStyle='#ffffff14';cx.fillRect(bx,by,170,100);cx.strokeStyle=c;glow(c,12);cx.lineWidth=3;cx.strokeRect(bx,by,170,100);cx.shadowBlur=0;txt(v,bx+85,by+68,52)})}}}},
color:{n:'ЦВЕТА',h:'Жми кнопку ЦВЕТА слова, а не того, что написано!',fmt:s=>s+' очк.',f(R){
  const N=['КРАСНЫЙ','СИНИЙ','ЗЕЛЁНЫЙ','ЖЁЛТЫЙ'],H=['#ff3355','#3d7bff','#2ee86b','#ffd400'];
  const Q=[...Array(90)].map(()=>{const w=R()*4|0;return[w,(w+1+(R()*3|0))%4]});let q=0,sc=0;
  return{score:()=>sc,click(x,y){H.forEach((c,i)=>{const bx=40+i*185;if(x>bx&&x<bx+170&&y>330&&y<460){if(i==Q[q][1]){sc++;boom(bx+85,395,c);beep(600,.06)}else{sc=Math.max(0,sc-1);beep(120,.2)}q++}})},
  draw(t){txt(N[Q[q][0]],400,200,100,H[Q[q][1]]);H.forEach((c,i)=>{cx.fillStyle=c;glow(c,20);cx.fillRect(40+i*185,330,170,130);cx.shadowBlur=0});txt(Math.ceil(G.dur-t),740,60,40,'#ffffff30')}}}},
stars:{n:'ЛОВИ',h:'Води корзину: лови жёлтые, не лови красные',fmt:s=>s+' очк.',f(R){
  const I=[];let q=0;for(let i=0;i<95;i++){q+=.22+R()*.12;I.push({t:q,x:40+R()*720,v:200+R()*120,b:R()<.3})}
  let bx=400,sc=0;
  return{get x(){return bx|0},get y(){return 450},score:()=>Math.max(0,sc),
  draw(t){bx+=(Math.min(760,Math.max(40,mx))-bx)*.3;
    for(const it of I){if(it.t>t)break;if(it.g)continue;const y=-20+it.v*(t-it.t);if(y>540)continue;
      if(y>425&&y<475&&Math.abs(it.x-bx)<58){it.g=1;if(it.b){sc-=15;boom(it.x,y,'#f55');beep(90,.3)}else{sc+=10;boom(it.x,y,'#ffd400');beep(800,.06)}continue}
      circ(it.x,y,15,it.b?'#ff3355':'#ffd400')}
    for(const id in pg){const p=pg[id];if(p.x!=null){cx.globalAlpha=.4;cx.fillStyle=col(id);cx.fillRect(p.x-45,445,90,14);cx.globalAlpha=1}}
    cx.fillStyle=col(me);glow(col(me),20);cx.fillRect(bx-55,445,110,16);cx.shadowBlur=0}}}},
coins:{n:'МОНЕТЫ',h:'Води пальцем и собирай монеты!',fmt:s=>s+' мон.',f(R){
  let sc=0,c,px=400,py=250;const sp=t=>c={x:50+R()*700,y:50+R()*400,t0:t};sp(0);
  return{get x(){return px|0},get y(){return py|0},score:()=>sc,
  draw(t){px+=(Math.min(780,Math.max(20,mx))-px)*.3;py+=(Math.min(480,Math.max(20,my))-py)*.3;
    if(t-c.t0>2.2)sp(t);if(Math.hypot(c.x-px,c.y-py)<32){sc++;boom(c.x,c.y,'#ffd400');beep(700+sc*20,.06);sp(t)}
    circ(c.x,c.y,18,'#ffd400');cx.strokeStyle='#ffd40088';cx.lineWidth=3;cx.beginPath();cx.arc(c.x,c.y,18+30*(1-(t-c.t0)/2.2),0,6.3);cx.stroke();
    for(const id in pg){const p=pg[id];if(p.x!=null)circ(p.x,p.y,10,col(id)+'88')}circ(px,py,12,col(me));txt(Math.ceil(G.dur-t),740,60,40,'#ffffff30')}}}},
timer:{n:'ТАЙМЕР',h:'Нажми ровно через N секунд. Цифры исчезнут!',fmt:s=>(3000-s)+' мс ошибки',f(R){
  const T=[3,4,5];let r=0,ts=0,sh=null,err=0,msg='',dn=false;
  const hit=(t,e)=>{err+=e;msg=e>=2000?'Не успел':(e|0)+' мс';sh=t;beep(e<150?900:300,.15)};
  return{get done(){return dn},score:()=>Math.max(0,3000-err|0),
  click(x,y,t){if(sh==null&&!dn)hit(t,Math.abs(t-ts-T[r])*1000)},
  draw(t){if(sh!=null&&t-sh>1.2){sh=null;r++;ts=t;if(r>2)dn=true}
    if(!dn&&sh==null&&t-ts>T[r]+2)hit(t,2000);
    txt(dn?'Готово!':'Через '+T[r]+' сек',400,150,50,'#00e5ff');
    if(sh!=null)txt(msg,400,300,90);else if(!dn)txt(t-ts<1?(t-ts).toFixed(1):'?',400,300,110,'#ff3df2');
    txt('Раунд '+Math.min(r+1,3)+'/3',400,430,28)}}}}

};

// управление
const pos=e=>{const r=cv.getBoundingClientRect();return[(e.clientX-r.left)*800/r.width,(e.clientY-r.top)*500/r.height]};
cv.onpointermove=e=>[mx,my]=pos(e);
cv.onpointerdown=e=>{[mx,my]=pos(e);if(G&&G.run){const t=(performance.now()-G.t0)/1000;if(t>=0&&G.gm.click)G.gm.click(mx,my,t)}};
onkeydown=e=>{if(G&&G.run&&G.gm.key&&performance.now()>G.t0){G.gm.key(e.key);e.preventDefault()}};

function hud(){$('#hud').innerHTML=pls.map(p=>{const s=p.id==me?G.gm.score():(pg[p.id]&&pg[p.id].s)||0;
  return `<div class=p style="--c:${col(p.id)}"><span>${p.name}</span><b>${G.def.fmt(s)}</b></div>`}).join('')+`<div class=p style="--c:#fff">${G.i+1}/${G.n}</div>`}
let last=performance.now();
function loop(now){requestAnimationFrame(loop);const dt=Math.min(.05,(now-last)/1000);last=now;if(!G||!G.run)return;
  const t=(now-G.t0)/1000;cx.clearRect(0,0,800,500);
  if(t<0){txt(G.def.n,400,160,66,'#00e5ff');txt(G.def.h,400,225,26);txt(Math.ceil(-t),400,370,130,'#ff3df2')}
  else{G.gm.draw(t);
    if(!G.fin&&(G.gm.done||t>=G.dur)){G.fin=1;tx({t:'done',s:G.gm.score()})}
    if(now-G.sent>80){G.sent=now;tx({t:'prog',s:G.gm.score(),x:G.gm.x,y:G.gm.y,a:!G.gm.done})}}
  parts=parts.filter(p=>(p.l-=dt*1.6)>0);
  for(const p of parts){p.x+=p.vx*dt;p.y+=p.vy*dt;cx.globalAlpha=p.l;circ(p.x,p.y,4,p.c)}cx.globalAlpha=1;
  if(now-(G.h||0)>150){G.h=now;hud()}}
requestAnimationFrame(loop);
show('join');
</script>
