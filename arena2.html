<script>
const $=s=>document.querySelector(s),C=['#00e5ff','#ff3df2','#b6ff00','#ffb300','#7c4dff','#ff5252','#40ffa0','#ffffff'];
let me,pls=[],host,G,pg={},parts=[],ac,mx=400,my=420,muted=0,busy=0,rcd,RM=matchMedia('(prefers-reduced-motion:reduce)').matches;const esc=s=>String(s).replace(/[&<>"']/g,c=>'&#'+c.charCodeAt(0)+';');
const col=id=>C[((pls.find(p=>p.id==id)||{}).ci||0)%8];
let scr='join';const show=i=>{scr=i;document.querySelectorAll('.s').forEach(e=>e.classList.toggle('on',e.id==i));setMus(i=='g'?2:1);placeMt()};
function placeMt(){const m=$('#mt'),b=scr=='g'&&document.body.classList.contains('pt')?$('#hb'):document.body;if(m.parentNode!==b)b.appendChild(m);m.classList.toggle('in',b!==document.body)}
const mul=a=>()=>{a|=0;a=a+0x6D2B79F5|0;let t=Math.imul(a^a>>>15,1|a);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296};
let mg,mgm,mus=0,mstep=0,mnext=0;
function actx(){if(!ac){ac=new AudioContext();mg=ac.createGain();mg.gain.value=muted?0:.5;mg.connect(ac.destination);mgm=ac.createGain();mgm.gain.value=.55;mgm.connect(mg);setInterval(musTick,100)}ac.state=='suspended'&&ac.resume();return ac}
function note(f,d,ty='triangle',v=.08,w=0,dest){const a=actx(),o=a.createOscillator(),g=a.createGain(),t=a.currentTime+w;o.type=ty;o.frequency.value=f;g.gain.setValueAtTime(.0001,t);g.gain.exponentialRampToValueAtTime(v,t+.01);g.gain.exponentialRampToValueAtTime(.0001,t+d);o.connect(g);g.connect(dest||mg);o.start(t);o.stop(t+d+.05)}
function beep(f,d=.1){if(muted)return;try{note(f,d,'triangle',.09);note(f*2,d*.6,'sine',.03)}catch{}}
const hh=x=>[...String(x)].reduce((a,c)=>a*31+c.charCodeAt(0)|0,7)>>>0;
const SCS=[[0,3,7,10,12,15,19,22],[0,2,4,7,9,12,14,16],[0,2,3,7,9,12,14,15],[0,1,5,7,8,12,13,17]];
let mr=110,msc=SCS[0],msp=.2,mld='square',mbs=[0,0,-4,-2];
function setMus(n,k){mus=n;if(n==2){const h=hh(k||'x');mr=[98,110,123,131,147,165][h%6];msc=SCS[(h>>>3)%4];msp=.105+((h>>>6)%5)*.012;mld=['square','sawtooth','triangle'][(h>>>9)%3];mbs=[[0,0,-4,-2],[0,-5,-3,-7],[0,3,-2,-4]][(h>>>12)%3]}
  else if(n==3){mr=131;msc=SCS[1];msp=.14;mld='triangle';mbs=[0,5,7,0]}else{mr=110;msc=SCS[0];msp=.2;mld='square';mbs=[0,0,-4,-2]}mstep=0}
function musTick(){if(muted||!ac||!mus)return;const sp=msp*(mus==2&&G&&G.run&&G.dur-(performance.now()-G.t0)/1000<5?.8:1);if(mnext<ac.currentTime)mnext=ac.currentTime+.05;
  while(mnext<ac.currentTime+.3){const s=mstep++,w=mnext-ac.currentTime,r=mr*Math.pow(2,mbs[(s>>4)%4]/12);
    if(s%4==0){note(r,sp*3.5,'sawtooth',.05,w,mgm);note(52,.14,'sine',mus==1?.08:.2,w,mgm)}
    if(mus!=1&&s%2==1)note(9000,.03,'square',.012,w,mgm);
    if(mus==2&&s%8==4)note(220,.08,'square',.03,w,mgm);
    note(r*4*Math.pow(2,msc[(s*3+(s>>3))%8]/12),sp*1.6,mld,.02,w,mgm);mnext+=sp}}
addEventListener('pointerdown',()=>{actx();if(!mus)setMus(1)},{once:true});
let shake=0;const boom=(x,y,c)=>{if(c=='#f55'&&!RM){shake=14;navigator.vibrate&&navigator.vibrate(70)}for(let i=0;i<24;i++){const a=Math.random()*6.3,v=60+Math.random()*240;parts.push({x,y,vx:Math.cos(a)*v,vy:Math.sin(a)*v,l:1,c})}};

// фон со звёздами
const bg=$('#bg'),bx=bg.getContext('2d');let st=[];
function rs(){bg.width=innerWidth;bg.height=innerHeight;st=Array.from({length:170},()=>({x:Math.random()*bg.width,y:Math.random()*bg.height,z:Math.random()*2+.3}))}rs();onresize=rs;
(function bl(t){t=(t||0)/1000;const w=bg.width,h=bg.height;let g=bx.createRadialGradient(w/2,h*.4,0,w/2,h*.4,w*.75);g.addColorStop(0,'#2a0f5c');g.addColorStop(1,'#04010b');bx.fillStyle=g;bx.fillRect(0,0,w,h);
bx.globalCompositeOperation='lighter';[['#00e5ff',.3,0],['#ff3df2',.7,2.1],['#7c4dff',.5,4]].forEach(([c,k,p])=>{const x=w*(k+.12*Math.sin(t*.2+p)),y=h*(.35+.15*Math.cos(t*.15+p)),r=Math.max(w,h)*.35;g=bx.createRadialGradient(x,y,0,x,y,r);g.addColorStop(0,c+'33');g.addColorStop(1,'#0000');bx.fillStyle=g;bx.fillRect(0,0,w,h)});
bx.strokeStyle='#a040ff';bx.lineWidth=1;const hz=h*.62;for(let i=0;i<14;i++){const f=((i+t*.5)%14)/14,y=hz+(h-hz)*f*f;bx.globalAlpha=.05+.25*f;bx.beginPath();bx.moveTo(0,y);bx.lineTo(w,y);bx.stroke()}
for(let i=-12;i<=12;i++){bx.globalAlpha=.18;bx.beginPath();bx.moveTo(w/2+i*w*.02,hz);bx.lineTo(w/2+i*w*.16,h);bx.stroke()}
bx.globalCompositeOperation='source-over';bx.fillStyle='#fff';for(const s of st){s.y=(s.y+s.z*.4)%h;bx.globalAlpha=(s.z/2.5)*(.6+.4*Math.sin(t*3+s.x));bx.fillRect(s.x,s.y,s.z,s.z)}bx.globalAlpha=1;requestAnimationFrame(bl)})();

// сеть: комната через публичный MQTT-брокер, хозяин комнаты = «сервер» прямо в его браузере
const BR=['wss://broker.hivemq.com:8884/mqtt','wss://broker.emqx.io:8084/mqtt','wss://test.mosquitto.org:8081'];
let mq,T,isH=0,pname,lastDn=0,joined=0,iv=[];
const every=(f,ms)=>iv.push(setInterval(f,ms)),rnd=n=>[...Array(n)].map(()=>'ABCDEFGHJKLMNPQRSTUVWXYZ'[Math.random()*24|0]).join('');
const pub=(k,o)=>mq&&mq.connected&&mq.publish(T+'/'+k,JSON.stringify(o));
const tx=o=>{o.from=me;if(o.t=='prog'||o.t=='evt'){o.id=me;o.ex=me;pub('d',o)}else pub('u',o)};
function err(s){iv.forEach(clearInterval);iv=[];const c=mq;mq=null;try{c&&c.end(true)}catch{}joined=0;isH=0;P=new Map();clearTimeout(tm);G=null;phase='lobby';gi=0;order=[];pg={};parts=[];host=null;busy=0;$('#err').textContent=s;show('join')}
function conn(i,cb){if(typeof mqtt=='undefined')return cb(null);let d=0,to;
  const fin=c=>{if(d)return;d=1;clearTimeout(to);cb(c)};
  const c=mqtt.connect(BR[i],{connectTimeout:6000,reconnectPeriod:0,clientId:'na'+Math.random().toString(36).slice(2,10)});
  to=setTimeout(()=>{try{c.end(true)}catch{}fin(null)},7000);
  c.on('connect',()=>{c.options.reconnectPeriod=2000;fin(c)});c.on('close',()=>{if(!c.connected)fin(null)});c.on('error',()=>{})}
function setup(c,code){mq=c;T='neonarena26/'+code;me=Math.random().toString(36).slice(2,8);lastDn=Date.now();$('#rc').textContent=code;
  c.on('message',(tp,b)=>{let m;try{m=JSON.parse(b.toString())}catch{return}
    if(tp==T+'/u'){if(isH)srv(m);return}
    if(m.ex==me||(m.to&&m.to!=me))return;lastDn=Date.now();on(m)});
  c.on('connect',()=>{if(mq==c)tx({t:'hello',name:pname})});
  c.subscribe(T+'/d');if(isH)c.subscribe(T+'/u');
  const hello=()=>tx({t:'hello',name:pname});hello();let n=0;
  every(()=>{if(!joined){if(++n>6)err('Комната не найдена или заполнена');else hello()}},1500);
  every(()=>tx({t:'hb'}),5000);
  every(()=>{if(Date.now()-lastDn>20000)err(isH?'Связь потеряна':'Хозяин комнаты пропал')},3000);
  if(isH)every(()=>{dn({t:'hb'});const t=Date.now();[...P.values()].forEach(p=>{if(t-p.seen>20000&&p.id!=me)drop(p.id)})},5000);
  const wl=()=>{try{navigator.wakeLock&&navigator.wakeLock.request('screen').catch(()=>{})}catch{}};wl();
  document.addEventListener('visibilitychange',()=>{if(!document.hidden)wl()})}
const nm=()=>{const v=$('#nm').value.trim()||'Игрок'+(Math.random()*99|0);try{localStorage.na=v}catch{}return v};
try{$('#nm').value=localStorage.na||''}catch{}
$('#cd').oninput=e=>e.target.value=e.target.value.toUpperCase().replace(/[^0-9A-Z]/g,'');

$('#mk').onclick=()=>{if(mq||busy)return;busy=1;pname=nm();isH=1;$('#err').textContent='Создаю комнату…';
  (function tryB(i){if(i>=BR.length)return err('Не удалось подключиться к серверам связи. Попробуй другую сеть');conn(i,c=>c?setup(c,(i+1)+rnd(4)):tryB(i+1))})(0)};
$('#go').onclick=()=>{if(mq||busy)return;const cd=$('#cd').value.trim().toUpperCase(),i=+cd[0]-1;pname=nm();
  if(cd.length!=5||!BR[i])return $('#err').textContent='Введи код из 5 символов';
  isH=0;busy=1;$('#err').textContent='Подключаюсь…';conn(i,c=>c?setup(c,cd):err('Не удалось подключиться. Попробуй другую сеть'))};
$('#mt').onclick=e=>{muted=!muted;if(mg)mg.gain.value=muted?0:.5;e.target.textContent=muted?'🔇':'🔊'};
$('#cd').onkeydown=e=>{if(e.key=='Enter')$('#go').click()};$('#nm').onkeydown=e=>{if(e.key=='Enter')($('#cd').value?$('#go'):$('#mk')).click()};
$('#st').onclick=()=>tx({t:'start'});
$('#cp').onclick=async()=>{const u=location.href.split('#')[0]+'#'+T.split('/')[1],b=$('#cp');
  try{if(navigator.share&&/Mobi|Android/i.test(navigator.userAgent))await navigator.share({title:'NEON ARENA',url:u});else await navigator.clipboard.writeText(u);b.textContent='Готово ✓'}
  catch(e){if(e&&e.name=='AbortError')return;prompt('Скопируй ссылку:',u)}setTimeout(()=>b.textContent='СКОПИРОВАТЬ ССЫЛКУ',2000)};
if(location.hash)$('#cd').value=location.hash.slice(1).toUpperCase().replace(/[^0-9A-Z]/g,'').slice(0,5);
document.addEventListener('visibilitychange',()=>{if(ac)document.hidden?ac.suspend():ac.resume()});
onpagehide=()=>tx({t:'leave'});

// логика «сервера» (работает только у хозяина комнаты)
const GAMES=['tap','react','dodge','math','spam','nums','color','stars','coins','timer','cmp','cmp2','parity','count','count2','arrow','arrow2','odd','odd2','sum','prod','whack','balloons','alt','meter','ring','mem','orbs','moving','bombs'],DUR={tap:15,react:30,dodge:30,math:20,spam:10,nums:30,color:20,stars:25,coins:20,timer:30,cmp:20,cmp2:20,parity:15,count:20,count2:20,arrow:15,arrow2:20,odd:15,odd2:15,sum:20,prod:20,whack:15,balloons:20,alt:10,meter:30,ring:30,mem:30,orbs:20,moving:15,bombs:15};
const CAP={react:5000,timer:3000,nums:1690,stars:950,meter:600,ring:500,mem:400};let P=new Map(),phase='lobby',gi=0,order=[],tm;
const dn=(o,to,ex)=>pub('d',{...o,to,ex,from:me});
const lobbyH=()=>dn({t:'lobby',phase,host:me,players:[...P.values()].map(p=>({id:p.id,name:p.name,ci:p.ci}))});
function startG(){phase='play';P.forEach(p=>p.score=null);const g=order[gi];
  dn({t:'game',g,i:gi,n:order.length,seed:Math.random()*1e9|0,dur:DUR[g],wait:3500});clearTimeout(tm);tm=setTimeout(finish,(DUR[g]+8)*1000)}
function finish(){if(phase!=='play')return;clearTimeout(tm);phase='result';
  const a=[...P.values()].sort((x,y)=>(y.score??-1)-(x.score??-1));
  a.forEach(p=>{const v=p.score??-1,k=a.filter(q=>(q.score??-1)>v).length;p.gain=v<=0?0:([3,2,1][k]||0);p.total+=p.gain});
  const last=gi==order.length-1,w=[...P.values()].sort((x,y)=>y.total-x.total)[0];
  dn({t:'result',final:last,win:w&&[...P.values()].filter(q=>q.total==w.total).map(q=>q.name).join(' и '),rows:a.map(p=>({id:p.id,name:p.name,score:p.score,gain:p.gain,total:p.total}))});
  tm=setTimeout(()=>{if(!P.size)return;if(last){gi=0;phase='lobby';P.forEach(p=>p.total=0);lobbyH()}else{gi++;startG()}},last?12000:7000)}
function drop(id){P.delete(id);if(!P.size){clearTimeout(tm);phase='lobby';gi=0;return}lobbyH();if(phase=='play'&&[...P.values()].every(q=>q.score!=null))finish()}
function srv(m){let p=P.get(m.from);
  if(m.t=='hello'){if(!p){if(P.size>=8)return;p={ci:[0,1,2,3,4,5,6,7].find(i=>![...P.values()].some(q=>q.ci==i)),id:m.from,name:String(m.name||'Игрок').replace(/[<>&"'`]/g,'').slice(0,12)||'Игрок',total:0,score:phase=='play'?-1:null};P.set(m.from,p)}p.seen=Date.now();return lobbyH()}
  if(!p)return;p.seen=Date.now();
  if(m.t=='start'&&phase=='lobby'&&m.from==me){order=[...GAMES].sort(()=>Math.random()-.5).slice(0,6);gi=0;P.forEach(q=>q.total=0);startG()}

    for(const id in pg){const p=pg[id];if(p.x!=null)circ(p.x*W,p.y*H,10,col(id)+'88')}circ(px,py,12,col(me));txt(Math.ceil(G.dur-t),W-60,60,40,'#ffffff30')}}}},
timer:{pt:1,n:'ТАЙМЕР',h:'Нажми ровно через N секунд. Цифры исчезнут!',fmt:s=>(3000-s)+' мс ошибки',f(R){
  const T=[3,4,5];let r=0,ts=0,sh=null,err=0,msg='',dn=false;
  const hit=(t,e)=>{err+=e;msg=e>=2000?'Не успел':(e|0)+' мс';sh=t;beep(e<150?900:300,.15)};
  return{get done(){return dn},score:()=>Math.max(0,3000-err|0),
  click(x,y,t){if(sh==null&&!dn)hit(t,Math.abs(t-ts-T[r])*1000)},
  draw(t){if(sh!=null&&t-sh>1.2){sh=null;r++;ts=t;if(r>2)dn=true}
    if(!dn&&sh==null&&t-ts>T[r]+2)hit(t,2000);
    txt(dn?'Готово!':'Через '+T[r]+' сек',W/2,H*.22,PT?40:50,'#00e5ff');
    if(sh!=null)txt(msg,W/2,H/2,PT?64:90);else if(!dn)txt(t-ts<1?(t-ts).toFixed(1):'?',W/2,H/2,PT?90:110,'#ff3df2');
    txt('Раунд '+Math.min(r+1,3)+'/3',W/2,H*.8,28)}}}},
cmp:QZ('БОЛЬШЕ','Жми сторону, где число БОЛЬШЕ',gCmp(false)),
cmp2:QZ('МЕНЬШЕ','Жми сторону, где число МЕНЬШЕ',gCmp(true)),
parity:QZ('ЧЁТ / НЕЧЁТ','Чётное или нечётное число?',gPar),
count:QZ('СКОЛЬКО','Сколько точек на экране?',gCnt(false)),
count2:QZ('КРАСНЫЕ','Считай только КРАСНЫЕ точки',gCnt(true)),
arrow:QZ('СТРЕЛКИ','Жми туда, куда указывает стрелка',gArr(false)),

odd:QZ('ЛИШНИЙ ЦВЕТ','Найди кнопку другого цвета',gOdd),

sum:QZ('СУММА','Выбери верный ответ',gSum(false)),
prod:QZ('УМНОЖЕНИЕ','Выбери верный ответ',gSum(true)),
whack:{pt:1,n:'КРОТЫ',h:'Бей крота, пока он не спрятался!',fmt:s=>s+' поп.',f(R){
  let sc=0,c=R()*9|0,t0=0;const cw=PT?150:180,ch=PT?130:110,pos=i=>PT?[10+i%3*163,H*.22+(i/3|0)*(ch+14)]:[110+i%3*200,70+(i/3|0)*130];
  return{score:()=>sc,
    click(x,y,t){const[bx,by]=pos(c);if(x>bx&&x<bx+cw&&y>by&&y<by+ch){sc++;boom(bx+cw/2,by+ch/2,'#b6ff00');beep(500+sc*15,.06);c=R()*9|0;t0=t}else beep(120,.1)},
    draw(t){if(t-t0>1){c=R()*9|0;t0=t}for(let i=0;i<9;i++){const[bx,by]=pos(i);cx.fillStyle=i==c?'#7a4a1a':'#ffffff10';cx.fillRect(bx,by,cw,ch);if(i==c)txt('🐹',bx+cw/2,by+ch*.68,PT?56:64)}txt(Math.ceil(G.dur-t),W-60,60,40,'#ffffff30')}}}},
balloons:{pt:1,n:'ШАРИКИ',h:'Лопай шарики, пока не улетели!',fmt:s=>s+' шар.',f(R){
  const B=[];let q=0,sc=0;for(let i=0;i<110;i++){q+=.2+R()*.15;B.push({t:q,x:50+R()*(W-100),v:(90+R()*90)*(PT?1.5:1),r:26+R()*14,c:'hsl('+(R()*360|0)+',85%,60%)'})}
  const yy=(b,t)=>H+40-b.v*(t-b.t);
  return{score:()=>sc,
    click(x,y,t){for(const b of B){if(b.t>t)break;if(b.p)continue;if(Math.hypot(b.x-x,yy(b,t)-y)<b.r+8){b.p=1;sc++;boom(b.x,yy(b,t),b.c);beep(500+sc*10,.05);break}}},
    draw(t){for(const b of B){if(b.t>t)break;if(b.p)continue;const y=yy(b,t);if(y<-40)continue;circ(b.x,y,b.r,b.c)}txt(Math.ceil(G.dur-t),W-60,60,40,'#ffffff30')}}}},
alt:{pt:1,n:'ПОПЕРЕМЕННО',h:'Тапай поочерёдно: ЛЕВО, ПРАВО, ЛЕВО…',fmt:s=>s+' тапов',f(R){let sc=0,nx=0,fl=0;
  return{score:()=>sc,click(x){const s=x<W/2?0:1;if(s==nx){sc++;nx=1-nx;beep(300+s*200,.04)}else{fl=.2;beep(100,.1)}},
    draw(t){fl=Math.max(0,fl-.016);cx.fillStyle=nx?'#00e5ff22':'#ff3df222';cx.fillRect(nx?W/2:0,0,W/2,H);txt(nx?'ПРАВО ▶':'◀ ЛЕВО',W/2,H*.25,PT?44:60,fl>0?'#f55':'#fff');txt(sc,W/2,H/2,100);txt(Math.ceil(G.dur-t),W-60,60,40,'#ffffff30')}}}},
meter:{pt:1,n:'ШКАЛА',h:'Жми, когда ползунок в центре! 6 попыток',fmt:s=>s+' очк.',f(R){
  const S=[...Array(6)].map(()=>3+R()*3),Ph=[...Array(6)].map(()=>R()*6.28);let r=0,ts=0,sh=null,sc=0,msg='',dn=false;const pos=t=>50+50*Math.sin((t-ts)*S[r]+Ph[r]);
  return{get done(){return dn},score:()=>sc,
    click(x,y,t){if(sh!=null||dn)return;const g=Math.max(0,100-Math.abs(pos(t)-50)*2.5)|0;sc+=g;msg='+'+g;sh=t;beep(300+g*5,.1)},
    draw(t){if(!dn&&sh!=null&&t-sh>.8){sh=null;r++;ts=t;if(r>5)dn=true}if(!dn&&sh==null&&t-ts>6){sh=t;msg='+0'}
      cx.fillStyle='#ffffff18';cx.fillRect(W*.1,H/2-20,W*.8,40);cx.fillStyle='#19c45a';cx.fillRect(W*.46,H/2-20,W*.08,40);
      if(dn)txt('Готово!',W/2,H/2,70);else{circ(W*.1+W*.008*pos(sh!=null?sh:t),H/2,22,'#ff3df2');txt('Попытка '+(r+1)+'/6',W/2,H*.3,40);if(sh!=null)txt(msg,W/2,H*.62,80)}}}}},
ring:{pt:1,n:'КОЛЬЦО',h:'Жми, когда круг дорастёт до белого кольца',fmt:s=>s+' очк.',f(R){
  const T=[0,1,2,3,4].map(()=>60+R()*70);let r=0,ts=0,sh=null,sc=0,msg='',dn=false,rr=0;
  return{get done(){return dn},score:()=>sc,
    click(x,y,t){if(sh!=null||dn)return;rr=20+(t-ts)*70;const g=Math.max(0,100-Math.abs(rr-T[r])*1.5)|0;sc+=g;msg='+'+g;sh=t;beep(300+g*5,.1)},
    draw(t){if(!dn&&sh!=null&&t-sh>.8){sh=null;r++;ts=t;if(r>4)dn=true}if(!dn&&sh==null&&20+(t-ts)*70>200){sh=t;rr=200;msg='+0'}
      if(dn){txt('Готово!',W/2,H/2,70);return}cx.strokeStyle='#fff';cx.lineWidth=4;cx.beginPath();cx.arc(W/2,H/2,T[r],0,6.3);cx.stroke();
      circ(W/2,H/2,sh!=null?rr:20+(t-ts)*70,'#ff3df288');if(sh!=null)txt(msg,W/2,H/2,60);txt('Раунд '+(r+1)+'/5',W/2,70,32)}}}},
mem:{pt:1,n:'ПАМЯТЬ',h:'Запомни порядок цветов и повтори',fmt:s=>(s/10|0)+' ур.',f(R){
  const Sq=[...Array(40)].map(()=>R()*4|0),HC=['#ff3355','#3d7bff','#2ee86b','#ffd400'];let L=1,ph='show',ts=.8,ix=0,dn=false,lit=-1,lt=0;const pw=PT?(W-50)/2:250,pq=PT?Math.min(260,(H-200)/2-10):170,pad=i=>PT?[20+i%2*(pw+10),110+(i/2|0)*(pq+10)]:[140+i%2*270,70+(i/2|0)*190];
  return{get done(){return dn},score:()=>(L-1)*10+ix,
    click(x,y,t){if(ph!='in'||dn)return;for(let i=0;i<4;i++){const[bx,by]=pad(i);if(x>bx&&x<bx+pw&&y>by&&y<by+pq){lit=i;lt=t;beep(300+i*120,.15);if(i==Sq[ix]){ix++;if(ix==L){L++;ix=0;ph='show';ts=t+.9}}else{dn=true;beep(90,.5)}}}},
    draw(t){if(ph=='show'){const k=Math.floor((t-ts)/.8);if(k>=L)ph='in';else if(k>=0&&(t-ts)%.8<.55){lit=Sq[k];lt=t}}
      for(let i=0;i<4;i++){const[bx,by]=pad(i),on=lit==i&&t-lt<.4;cx.fillStyle=HC[i];cx.globalAlpha=on?1:.3;glow(HC[i],on?30:0);cx.fillRect(bx,by,pw,pq);cx.globalAlpha=1;cx.shadowBlur=0}
      txt(dn?'Ошибка!':ph=='show'?'Смотри…':'Повторяй!',W/2,60,36);txt('Уровень '+L,W-70,60,24)}}}},
orbs:{pt:1,n:'ОРБЫ',h:'Собирай орбы, избегай красных шаров!',fmt:s=>s+' орб.',f(R){
  const E=[0,1,2].map(()=>[R()*2+.6,R()*6,R()*2+.5,R()*6]);let sc=0,c,px=W/2,py=H/2,iv=0;const sp=t=>c={x:50+R()*(W-100),y:50+R()*(H-110),t0:t};sp(0);
  const ep=(e,t)=>[W/2+(W/2-70)*Math.sin(t*e[0]+e[1]),H/2+(H/2-60)*Math.cos(t*e[2]+e[3])];
  return{track:1,get x(){return NZ(px,W)},get y(){return NZ(py,H)},score:()=>sc,
    draw(t){px+=(Math.min(W-20,Math.max(20,fx))-px)*.3;py+=(Math.min(H-20,Math.max(20,fy))-py)*.3;if(t-c.t0>2.5)sp(t);
      if(Math.hypot(c.x-px,c.y-py)<32){sc++;boom(c.x,c.y,'#0ff');beep(700+sc*20,.06);sp(t)}
      for(const e of E){const[ex,ey]=ep(e,t);circ(ex,ey,22,'#ff3355');if(t>iv&&Math.hypot(ex-px,ey-py)<32){sc=Math.max(0,sc-1);iv=t+1.2;boom(px,py,'#f55');beep(90,.3)}}
      circ(c.x,c.y,16,'#00e5ff');for(const id in pg){const p=pg[id];if(p.x!=null)circ(p.x*W,p.y*H,10,col(id)+'88')}
      cx.globalAlpha=t<iv?.4:1;circ(px,py,12,col(me));cx.globalAlpha=1;txt(Math.ceil(G.dur-t),W-60,60,40,'#ffffff30')}}}},
moving:{pt:1,n:'МИШЕНЬ',h:'Попади по движущейся мишени!',fmt:s=>s+' поп.',f(R){
  let sc=0,p=[R()*2+1.2,R()*6,R()*2+1.2,R()*6];const at=t=>[W/2+(W/2-60)*Math.sin(t*p[0]+p[1]),H/2+(H/2-80)*Math.sin(t*p[2]+p[3])];
  return{score:()=>sc,click(x,y,t){const[tx_,ty]=at(t);if(Math.hypot(tx_-x,ty-y)<44){sc++;boom(tx_,ty,'#ff3df2');beep(500+sc*15,.06);p=[R()*2+1.2+sc*.05,R()*6,R()*2+1.2+sc*.05,R()*6]}else beep(120,.1)},
    draw(t){const[tx_,ty]=at(t);circ(tx_,ty,40,'#ff3df2');cx.strokeStyle='#fff';cx.lineWidth=4;cx.beginPath();cx.arc(tx_,ty,20,0,6.3);cx.stroke();txt(Math.ceil(G.dur-t),W-60,60,40,'#ffffff30')}}}},
bombs:{pt:1,n:'БОМБЫ',h:'Жми синие, НЕ жми красные!',fmt:s=>s+' очк.',f(R){
  let sc=0,tg;const sp=t=>tg={x:60+R()*(W-120),y:60+R()*(H-160),t0:t,b:R()<.4};sp(0);
  return{score:()=>Math.max(0,sc),click(x,y,t){if(Math.hypot(x-tg.x,y-tg.y)<48){if(tg.b){sc-=2;boom(x,y,'#f55');beep(90,.3)}else{sc++;boom(x,y,'#0ff');beep(550,.05)}sp(t)}},
    draw(t){if(t-tg.t0>1)sp(t);circ(tg.x,tg.y,44,tg.b?'#ff3355':'#00e5ff');if(tg.b)txt('💣',tg.x,tg.y+14,40);txt(Math.ceil(G.dur-t),W-60,60,40,'#ffffff30')}}}}

};

// управление
let td=0,fx=400,fy=420;
const pos=e=>{const r=cv.getBoundingClientRect();return[(e.clientX-r.left)*W/r.width,(e.clientY-r.top)*H/r.height,W/r.width]};
// пальцем объект ведём НАД касанием (≈60 px), чтобы палец не закрывал его; у нижнего края смещение плавно сходит на 0
const aim=e=>{const[x,y,k]=pos(e);mx=x;my=y;fx=x;fy=e.pointerType=='mouse'?y:y-60*k*Math.min(1,Math.max(0,(H-y)/140));return[x,y]};
cv.onpointermove=e=>{aim(e)};
cv.onpointerup=cv.onpointercancel=()=>{td=0};
cv.oncontextmenu=e=>e.preventDefault();
cv.onpointerdown=e=>{try{cv.setPointerCapture(e.pointerId)}catch{}td=e.pointerType!='mouse'?1:0;const[x,y]=aim(e);if(G&&G.run){const t=(performance.now()-G.t0)/1000;if(t>=0&&G.gm.click)G.gm.click(x,y,t)}};
onkeydown=e=>{if(G&&G.run&&G.gm.key&&performance.now()>G.t0){G.gm.key(e.key);e.preventDefault()}};

function hud(){const R=pls.map(p=>({p,s:p.id==me?G.gm.score():(pg[p.id]&&pg[p.id].s)||0}));
  const lead=Math.max(0,...R.map(r=>r.s));R.forEach(r=>r.k=R.filter(q=>q.s>r.s).length+1);R.sort((a,b)=>a.k-b.k);
  const f=s=>String(G.def.fmt(s)).split(' ')[0],el=$('#hud');
  el.style.setProperty('--n',PT?Math.min(Math.max(R.length,1),4):R.length+1);
  el.innerHTML=R.map(r=>`<div class="hc${r.p.id==me?' me':''}" style="--c:${col(r.p.id)}"><i>${lead>0?r.k+'. ':''}${esc(r.p.name)}</i><b>${f(r.s)}</b><em style="width:${lead>0?Math.max(4,Math.round(r.s/lead*100)):0}%"></em></div>`).join('')+(PT?'':`<div class="hc" style="--c:#fff"><i>ИГРА</i><b>${G.i+1}/${G.n}</b></div>`);
  $('#gt').innerHTML=`<span style="color:${G.ac}">${G.def.n}</span> · ${G.i+1}/${G.n}`}
let last=performance.now();
function loop(now){requestAnimationFrame(loop);const dt=Math.min(.05,(now-last)/1000);last=now;if(!G||!G.run)return;
  const t=(now-G.t0)/1000;cx.clearRect(0,0,W,H);cx.save();if(shake>.5){cx.translate((Math.random()-.5)*shake,(Math.random()-.5)*shake);shake*=.88}
  if(t<0){const c=Math.ceil(-t);if(c!=G.cd){G.cd=c;beep(520,.12)}txt('ИГРА '+(G.i+1)+' / '+G.n,W/2,95,22,'#ffffff90');txt(G.def.n,W/2,165,PT?48:66,G.ac);txt(G.def.h,W/2,225,PT?19:26);cx.strokeStyle=G.ac;cx.lineWidth=6;glow(G.ac,16);cx.beginPath();cx.arc(W/2,PT?H/2:335,92,-1.57,-1.57+6.283*(1-(-t%1)));cx.stroke();cx.shadowBlur=0;txt(Math.ceil(-t),W/2,(PT?H/2:335)+40,120,'#fff')}
  else{if(G.cd>0){G.cd=0;beep(1040,.3)}const rm=Math.ceil(G.dur-t);if(rm<=3&&rm>0&&rm!=G.tk){G.tk=rm;beep(700,.05)}G.gm.draw(t);cx.fillStyle=G.ac;glow(G.ac,12);cx.fillRect(0,0,Math.max(0,W*(1-t/G.dur)),5);cx.shadowBlur=0;
    if(!G.fin&&(G.gm.done||t>=G.dur)){G.fin=1;tx({t:'done',s:G.gm.score()})}
    if(now-G.sent>100){const k=G.gm.score()+'|'+G.gm.x+'|'+G.gm.y+'|'+!G.gm.done;if(k!=G.lk||now-G.sent>1000){G.lk=k;G.sent=now;tx({t:'prog',s:G.gm.score(),x:G.gm.x,y:G.gm.y,a:!G.gm.done})}}}
  parts=parts.filter(p=>(p.l-=dt*1.6)>0);
  cx.globalCompositeOperation='lighter';for(const p of parts){p.x+=p.vx*dt;p.y+=p.vy*dt;p.vx*=.985;p.vy*=.985;cx.globalAlpha=p.l;cx.fillStyle=p.c;cx.beginPath();cx.arc(p.x,p.y,1.5+4*p.l,0,6.3);cx.fill()}cx.globalCompositeOperation='source-over';cx.globalAlpha=1;
  if(td&&G.gm.track&&!G.gm.done&&t>=0){cx.save();cx.globalAlpha=.4;cx.strokeStyle='#fff';cx.lineWidth=2;cx.beginPath();cx.arc(mx,my,15,0,6.3);cx.stroke();cx.setLineDash([3,7]);cx.beginPath();cx.moveTo(mx,my);cx.lineTo(fx,fy);cx.stroke();cx.restore()}
  cx.restore();if(now-(G.h||0)>150){G.h=now;hud()}}
requestAnimationFrame(loop);
setInterval(()=>{if(G&&G.run&&!G.fin&&(performance.now()-G.t0)/1000>=G.dur){G.fin=1;tx({t:'done',s:G.gm.score()})}},500);
show('join');
</script>
