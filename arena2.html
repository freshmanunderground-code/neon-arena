<!doctype html><html lang="ru"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no"><title>NEON ARENA</title>
<style>
*{box-sizing:border-box;margin:0}
body{height:100dvh;overflow:hidden;overscroll-behavior:none;user-select:none;-webkit-user-select:none;-webkit-tap-highlight-color:transparent;background:#06020f;color:#fff;font:600 16px system-ui,Segoe UI,sans-serif;display:grid;place-items:center}
#bg{position:fixed;inset:0;z-index:0}
.s{display:none;position:relative;z-index:1;text-align:center;padding:28px 34px;border-radius:24px;background:rgba(20,10,45,.6);backdrop-filter:blur(14px);border:1px solid rgba(255,255,255,.15);box-shadow:0 0 60px rgba(150,60,255,.35);min-width:min(92vw,440px)}
.s.on{display:block;animation:pop .35s cubic-bezier(.2,1.4,.4,1)}@keyframes pop{from{opacity:0;transform:scale(.92) translateY(14px)}}button:active{transform:scale(.95)}
h1{font-size:clamp(30px,6vw,60px);letter-spacing:4px;background:linear-gradient(90deg,#00e5ff,#ff3df2,#b6ff00);-webkit-background-clip:text;background-clip:text;color:transparent;filter:drop-shadow(0 0 18px #a0f);margin-bottom:10px}
input,button{font:inherit;border-radius:14px;border:1px solid #fff4;padding:12px 22px;margin:10px 0;background:#ffffff14;color:#fff;outline:0;text-align:center}
button{cursor:pointer;background:linear-gradient(90deg,#00e5ff,#a040ff);border:0;font-weight:800;box-shadow:0 0 24px #a040ff88;transition:.15s}
button:hover{transform:scale(1.06)}button:disabled{opacity:.35;transform:none}
.p{display:flex;justify-content:space-between;gap:20px;padding:10px 14px;margin:6px 0;border-radius:12px;background:#ffffff12;border-left:5px solid var(--c)}
#g{padding:6px;min-width:0}
#hud{display:flex;gap:6px;justify-content:center;margin-bottom:4px;overflow:hidden}
#hud .p{margin:0;padding:3px 8px;font-size:12px;gap:8px;min-width:0;max-width:32vw;white-space:nowrap;background:#000a}#hud .p span{overflow:hidden;text-overflow:ellipsis}
#cv{display:block;width:min(98vw,calc((100dvh - 52px)*1.6));aspect-ratio:8/5;border-radius:18px;box-shadow:0 0 50px #7a3cff88;border:1px solid #fff3;cursor:crosshair;touch-action:none;
background:linear-gradient(#0a0418e8,#0a0418e8),repeating-linear-gradient(0deg,#6a3cff 0 1px,transparent 1px 50px),repeating-linear-gradient(90deg,#6a3cff 0 1px,transparent 1px 50px)}
small{opacity:.7}#rot{display:none;font-size:13px;opacity:.8;margin-bottom:6px}@media(orientation:portrait){#rot{display:block}}input{user-select:text;-webkit-user-select:text}

<canvas id=bg></canvas><button id=mt style="position:fixed;top:10px;right:10px;z-index:5;padding:8px 12px;margin:0">🔊</button>
<div class=s id=join><h1>NEON ARENA</h1><p>30 мини-игр · до 8 игроков · по интернету</p><input id=nm maxlength=12 placeholder="Твой ник"><br><button id=mk>СОЗДАТЬ КОМНАТУ</button><br><small>или войти к другу:</small><br><input id=cd maxlength=5 placeholder="Код комнаты" style="text-transform:uppercase"><br><button id=go>ВОЙТИ ПО КОДУ</button><p id=err></p></div>
<div class=s id=lobby><h1>ЛОББИ</h1><p>Код комнаты: <b id=rc style="font-size:30px;letter-spacing:5px;color:#00e5ff"></b></p><button id=cp>СКОПИРОВАТЬ ССЫЛКУ</button><div id=pl></div><p id=lh></p><button id=st>СТАРТ</button><br><small>30 мини-игр, в каждой партии 6 случайных<br>1 место +3, 2 место +2, 3 место +1</small></div>
<div class=s id=g><div id=rot>↻ Поверни телефон горизонтально — так удобнее</div><div id=hud></div><canvas id=cv width=800 height=500></canvas></div>
<div class=s id=res><h1 id=rt></h1><div id=rr></div><p id=rn></p></div>
<script src="https://cdn.jsdelivr.net/npm/mqtt@5.10.1/dist/mqtt.min.js" onerror="var s=document.createElement('script');s.src='https://unpkg.com/mqtt@5.10.1/dist/mqtt.min.js';document.head.appendChild(s)"></script>
<script>
const $=s=>document.querySelector(s),C=['#00e5ff','#ff3df2','#b6ff00','#ffb300','#7c4dff','#ff5252','#40ffa0','#ffffff'];
let me,pls=[],host,G,pg={},parts=[],ac,mx=400,my=420,muted=0;const esc=s=>String(s).replace(/[&<>"']/g,c=>'&#'+c.charCodeAt(0)+';');
const col=id=>C[((pls.find(p=>p.id==id)||{}).ci||0)%8];
const show=i=>{document.querySelectorAll('.s').forEach(e=>e.classList.toggle('on',e.id==i));setMus(i=='g'?2:1)};
const mul=a=>()=>{a|=0;a=a+0x6D2B79F5|0;let t=Math.imul(a^a>>>15,1|a);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296};
let mg,mgm,mus=0,mstep=0,mnext=0;
function actx(){if(!ac){ac=new AudioContext();mg=ac.createGain();mg.gain.value=muted?0:.5;mg.connect(ac.destination);mgm=ac.createGain();mgm.gain.value=.55;mgm.connect(mg);setInterval(musTick,100)}ac.state=='suspended'&&ac.resume();return ac}
function note(f,d,ty='triangle',v=.08,w=0,dest){const a=actx(),o=a.createOscillator(),g=a.createGain(),t=a.currentTime+w;o.type=ty;o.frequency.value=f;g.gain.setValueAtTime(.0001,t);g.gain.exponentialRampToValueAtTime(v,t+.01);g.gain.exponentialRampToValueAtTime(.0001,t+d);o.connect(g);g.connect(dest||mg);o.start(t);o.stop(t+d+.05)}
function beep(f,d=.1){if(muted)return;try{note(f,d,'triangle',.09);note(f*2,d*.6,'sine',.03)}catch{}}
const SC=[0,3,7,10,12,15,19,22],BS=[0,0,-4,-2];
function setMus(n){mus=n}
function musTick(){if(muted||!ac||!mus)return;const sp=mus==2?.13:.2;if(mnext<ac.currentTime)mnext=ac.currentTime+.05;
  while(mnext<ac.currentTime+.3){const s=mstep++,w=mnext-ac.currentTime,r=110*Math.pow(2,BS[(s>>4)%4]/12);
    if(s%4==0){note(r,sp*3.5,'sawtooth',.05,w,mgm);note(52,.14,'sine',mus==2?.2:.1,w,mgm)}
    if(mus==2&&s%2==1)note(9000,.03,'square',.012,w,mgm);
    note(r*4*Math.pow(2,SC[(s*3+(s>>3))%8]/12),sp*1.6,'square',.02,w,mgm);mnext+=sp}}
addEventListener('pointerdown',()=>{actx();if(!mus)setMus(1)},{once:true});
let shake=0;const boom=(x,y,c)=>{if(c=='#f55'){shake=14;navigator.vibrate&&navigator.vibrate(70)}for(let i=0;i<24;i++){const a=Math.random()*6.3,v=60+Math.random()*240;parts.push({x,y,vx:Math.cos(a)*v,vy:Math.sin(a)*v,l:1,c})}};

// фон со звёздами
const bg=$('#bg'),bx=bg.getContext('2d');let st=[];
function rs(){bg.width=innerWidth;bg.height=innerHeight;st=Array.from({length:170},()=>({x:Math.random()*bg.width,y:Math.random()*bg.height,z:Math.random()*2+.3}))}rs();onresize=rs;
(function bl(t){t=(t||0)/1000;const w=bg.width,h=bg.height;let g=bx.createRadialGradient(w/2,h*.4,0,w/2,h*.4,w*.75);g.addColorStop(0,'#2a0f5c');g.addColorStop(1,'#04010b');bx.fillStyle=g;bx.fillRect(0,0,w,h);
bx.globalCompositeOperation='lighter';[['#00e5ff',.3,0],['#ff3df2',.7,2.1],['#7c4dff',.5,4]].forEach(([c,k,p])=>{const x=w*(k+.12*Math.sin(t*.2+p)),y=h*(.35+.15*Math.cos(t*.15+p)),r=Math.max(w,h)*.35;g=bx.createRadialGradient(x,y,0,x,y,r);g.addColorStop(0,c+'33');g.addColorStop(1,'#0000');bx.fillStyle=g;bx.fillRect(0,0,w,h)});
bx.strokeStyle='#a040ff';bx.lineWidth=1;const hz=h*.62;for(let i=0;i<14;i++){const f=((i+t*.5)%14)/14,y=hz+(h-hz)*f*f;bx.globalAlpha=.05+.25*f;bx.beginPath();bx.moveTo(0,y);bx.lineTo(w,y);bx.stroke()}
for(let i=-12;i<=12;i++){bx.globalAlpha=.18;bx.beginPath();bx.moveTo(w/2+i*w*.02,hz);bx.lineTo(w/2+i*w*.16,h);bx.stroke()}
bx.globalCompositeOperation='source-over';bx.fillStyle='#fff';for(const s of st){s.y=(s.y+s.z*.4)%h;bx.globalAlpha=(s.z/2.5)*(.6+.4*Math.sin(t*3+s.x));bx.fillRect(s.x,s.y,s.z,s.z)}bx.globalAlpha=1;requestAnimationFrame(bl)})();

// сеть: комната через публичный MQTT-брокер, хозяин комнаты = «сервер» прямо в его браузере
const BR=['wss://broker.hivemq.com:8884/mqtt','wss://broker.emqx.io:8084/mqtt','wss://test.mosquitto.org:8081'];
let mq,T,isH=0,pname,lastDn=0,joined=0,iv=[];
const every=(f,ms)=>iv.push(setInterval(f,ms)),rnd=n=>[...Array(n)].map(()=>'ABCDEFGHJKLMNPQRSTUVWXYZ'[Math.random()*24|0]).join('');
const pub=(k,o)=>mq&&mq.connected&&mq.publish(T+'/'+k,JSON.stringify(o));
const tx=o=>{o.from=me;if(o.t=='prog'||o.t=='evt'){o.id=me;o.ex=me;pub('d',o)}else pub('u',o)};
function err(s){iv.forEach(clearInterval);iv=[];const c=mq;mq=null;try{c&&c.end(true)}catch{}joined=0;isH=0;P=new Map();clearTimeout(tm);G=null;phase='lobby';gi=0;order=[];pg={};parts=[];host=null;$('#err').textContent=s;show('join')}
function conn(i,cb){if(typeof mqtt=='undefined')return cb(null);let d=0,to;
  const fin=c=>{if(d)return;d=1;clearTimeout(to);cb(c)};
  const c=mqtt.connect(BR[i],{connectTimeout:6000,reconnectPeriod:0,clientId:'na'+Math.random().toString(36).slice(2,10)});
  to=setTimeout(()=>{try{c.end(true)}catch{}fin(null)},7000);
  c.on('connect',()=>{c.options.reconnectPeriod=2000;fin(c)});c.on('close',()=>{if(!c.connected)fin(null)});c.on('error',()=>{})}
function setup(c,code){mq=c;T='neonarena26/'+code;me=Math.random().toString(36).slice(2,8);lastDn=Date.now();$('#rc').textContent=code;
  c.on('message',(tp,b)=>{let m;try{m=JSON.parse(b.toString())}catch{return}
    if(tp==T+'/u'){if(isH)srv(m);return}
    if(m.ex==me||(m.to&&m.to!=me))return;lastDn=Date.now();on(m)});
  c.on('connect',()=>{if(mq==c)tx({t:'hello',name:pname})});
  c.subscribe(T+'/d');if(isH)c.subscribe(T+'/u');
  const hello=()=>tx({t:'hello',name:pname});hello();let n=0;
  every(()=>{if(!joined){if(++n>6)err('Комната не найдена или заполнена');else hello()}},1500);
  every(()=>tx({t:'hb'}),5000);
  every(()=>{if(Date.now()-lastDn>20000)err(isH?'Связь потеряна':'Хозяин комнаты пропал')},3000);
  if(isH)every(()=>{dn({t:'hb'});const t=Date.now();[...P.values()].forEach(p=>{if(t-p.seen>20000&&p.id!=me)drop(p.id)})},5000);
  const wl=()=>{try{navigator.wakeLock&&navigator.wakeLock.request('screen').catch(()=>{})}catch{}};wl();
  document.addEventListener('visibilitychange',()=>{if(!document.hidden)wl()})}
const nm=()=>$('#nm').value.trim()||'Игрок'+(Math.random()*99|0);
$('#mk').onclick=()=>{pname=nm();isH=1;$('#err').textContent='Создаю комнату…';
  (function tryB(i){if(i>=BR.length)return err('Не удалось подключиться к серверам связи. Попробуй другую сеть');conn(i,c=>c?setup(c,(i+1)+rnd(4)):tryB(i+1))})(0)};
$('#go').onclick=()=>{const cd=$('#cd').value.trim().toUpperCase(),i=+cd[0]-1;pname=nm();
  if(cd.length!=5||!BR[i])return $('#err').textContent='Введи код из 5 символов';
  isH=0;$('#err').textContent='Подключаюсь…';conn(i,c=>c?setup(c,cd):err('Не удалось подключиться. Попробуй другую сеть'))};
$('#mt').onclick=e=>{muted=!muted;if(mg)mg.gain.value=muted?0:.5;e.target.textContent=muted?'🔇':'🔊'};
$('#cd').onkeydown=e=>{if(e.key=='Enter')$('#go').click()};$('#nm').onkeydown=e=>{if(e.key=='Enter')($('#cd').value?$('#go'):$('#mk')).click()};
$('#st').onclick=()=>tx({t:'start'});
$('#cp').onclick=async()=>{const u=location.href.split('#')[0]+'#'+T.split('/')[1],b=$('#cp');
  try{if(navigator.share&&/Mobi|Android/i.test(navigator.userAgent))await navigator.share({title:'NEON ARENA',url:u});else await navigator.clipboard.writeText(u);b.textContent='Готово ✓'}
  catch(e){if(e&&e.name=='AbortError')return;prompt('Скопируй ссылку:',u)}setTimeout(()=>b.textContent='СКОПИРОВАТЬ ССЫЛКУ',2000)};
if(location.hash)$('#cd').value=location.hash.slice(1).toUpperCase();
onpagehide=()=>tx({t:'leave'});

// логика «сервера» (работает только у хозяина комнаты)
const GAMES=['tap','react','dodge','math','spam','nums','color','stars','coins','timer','cmp','cmp2','parity','count','count2','arrow','arrow2','odd','odd2','sum','prod','whack','balloons','alt','meter','ring','mem','orbs','moving','bombs'],DUR={tap:15,react:30,dodge:30,math:20,spam:10,nums:30,color:20,stars:25,coins:20,timer:30,cmp:20,cmp2:20,parity:15,count:20,count2:20,arrow:15,arrow2:20,odd:15,odd2:15,sum:20,prod:20,whack:15,balloons:20,alt:10,meter:30,ring:30,mem:30,orbs:20,moving:15,bombs:15};
const CAP={react:5000,timer:3000,nums:1690,stars:950,meter:600,ring:500,mem:400};let P=new Map(),phase='lobby',gi=0,order=[],tm;
const dn=(o,to,ex)=>pub('d',{...o,to,ex,from:me});
const lobbyH=()=>dn({t:'lobby',phase,host:me,players:[...P.values()].map(p=>({id:p.id,name:p.name,ci:p.ci}))});
function startG(){phase='play';P.forEach(p=>p.score=null);const g=order[gi];
  dn({t:'game',g,i:gi,n:order.length,seed:Math.random()*1e9|0,dur:DUR[g],wait:3500});clearTimeout(tm);tm=setTimeout(finish,(DUR[g]+8)*1000)}
function finish(){if(phase!=='play')return;clearTimeout(tm);phase='result';
  const a=[...P.values()].sort((x,y)=>(y.score??-1)-(x.score??-1));
  a.forEach(p=>{const v=p.score??-1,k=a.filter(q=>(q.score??-1)>v).length;p.gain=v<=0?0:([3,2,1][k]||0);p.total+=p.gain});
  const last=gi==order.length-1,w=[...P.values()].sort((x,y)=>y.total-x.total)[0];
  dn({t:'result',final:last,win:w&&[...P.values()].filter(q=>q.total==w.total).map(q=>q.name).join(' и '),rows:a.map(p=>({id:p.id,name:p.name,score:p.score,gain:p.gain,total:p.total}))});
  tm=setTimeout(()=>{if(!P.size)return;if(last){gi=0;phase='lobby';P.forEach(p=>p.total=0);lobbyH()}else{gi++;startG()}},last?12000:7000)}
function drop(id){P.delete(id);if(!P.size){clearTimeout(tm);phase='lobby';gi=0;return}lobbyH();if(phase=='play'&&[...P.values()].every(q=>q.score!=null))finish()}
function srv(m){let p=P.get(m.from);
  if(m.t=='hello'){if(!p){if(P.size>=8)return;p={ci:[0,1,2,3,4,5,6,7].find(i=>![...P.values()].some(q=>q.ci==i)),id:m.from,name:String(m.name||'Игрок').replace(/[<>&"'`]/g,'').slice(0,12)||'Игрок',total:0,score:phase=='play'?-1:null};P.set(m.from,p)}p.seen=Date.now();return lobbyH()}
  if(!p)return;p.seen=Date.now();
  if(m.t=='start'&&phase=='lobby'&&m.from==me){order=[...GAMES].sort(()=>Math.random()-.5).slice(0,6);gi=0;P.forEach(q=>q.total=0);startG()}
  else if(m.t=='done'&&phase=='play'&&p.score==null){p.score=Math.min(CAP[order[gi]]||DUR[order[gi]]*15,Math.max(0,+m.s||0));dn({t:'prog',id:p.id,s:p.score,a:false},undefined,p.id);if([...P.values()].every(q=>q.score!=null))finish()}
  else if(m.t=='leave')drop(p.id)}

function on(m){if(host&&m.from&&m.from!=host&&m.t!='prog'&&m.t!='evt'&&m.t!='hb')return;
  if(m.t=='lobby'){if(m.players.length>pls.length)beep(880,.08);pls=m.players;host=m.host;if(m.players.some(p=>p.id==me))joined=1;
    $('#pl').innerHTML=pls.map(p=>`<div class=p style="--c:${col(p.id)}"><span>${esc(p.name)}</span><span>${p.id==host?'👑 хозяин':''}${p.id==me?' (ты)':''}</span></div>`).join('');
    $('#lh').textContent=m.phase!='lobby'?'Идёт игра — подключишься со следующей':host==me?'Ты хозяин — жми СТАРТ, когда все зашли':'Ждём, пока хозяин нажмёт СТАРТ';
    $('#st').disabled=host!=me||m.phase!='lobby';
    if(joined&&(m.phase=='lobby'||$('#join').classList.contains('on')))show('lobby')}
  else if(m.t=='game'){pg={};parts=[];show('g');G={...m,def:GM[m.g],t0:performance.now()+m.wait,gm:GM[m.g].f(mul(m.seed)),sent:0,fin:0,run:1}}
  else if(m.t=='prog')pg[m.id]=m;
  else if(m.t=='evt'&&G&&G.gm.evt)G.gm.evt(m);
  else if(m.t=='result'&&G){G.run=0;const f=G.def.fmt;
    $('#rt').textContent=m.final?'🏆 '+m.win+(m.win.includes(' и ')?' побеждают!':' побеждает!'):G.def.n+' — итоги';
    $('#rr').innerHTML=m.rows.map((r,i)=>`<div class=p style="--c:${col(r.id)}"><span>${i+1}. ${esc(r.name)}</span><span>${r.score==null||r.score<0?'—':f(r.score)} · <b>+${r.gain}</b> · всего ${r.total}</span></div>`).join('');
    $('#rn').textContent=m.final?'Возврат в лобби через 12 сек…':'Следующая игра через 7 сек…';
    show('res');{const mr=m.rows.find(r=>r.id==me);if(mr&&mr.gain>0)[523,659,784].forEach((f,i)=>note(f,.35,'triangle',.09,i*.09));else beep(180,.35)}if(m.final)for(let i=0;i<5;i++)setTimeout(()=>beep(400+i*150,.25),i*150)}
}

// рисование
const cv=$('#cv'),cx=cv.getContext('2d');
function fit(){const d=Math.min(2,devicePixelRatio||1);cv.width=800*d;cv.height=500*d;cx.setTransform(d,0,0,d,0,0)}fit();addEventListener('resize',fit);
const glow=(c,b=20)=>{cx.shadowColor=c;cx.shadowBlur=b};
const circ=(x,y,r,c)=>{cx.fillStyle=c;glow(c,25);cx.beginPath();cx.arc(x,y,r,0,6.3);cx.fill();cx.shadowBlur=0;if(r>8){cx.fillStyle='#ffffff55';cx.beginPath();cx.arc(x-r*.28,y-r*.28,r*.4,0,6.3);cx.fill()}};
const txt=(s,x,y,sz,c='#fff')=>{cx.font=`800 ${sz}px system-ui`;cx.textAlign='center';cx.fillStyle=c;glow(c,14);cx.fillText(s,x,y);cx.shadowBlur=0};

const isC=b=>/^(#|hsl)/.test(b),arrows=['↑','→','↓','←'],lr=['← слева','справа →'];
// шаблон «викторина»: gen(R) -> {k:кнопок, a:верная, b:i=>текст|цвет, q:рисует вопрос}
const QZ=(n,h,gen)=>({n,h,fmt:s=>s+' очк.',f(R){let sc=0,q=gen(R),fl=0;const bw=()=>(720-(q.k-1)*12)/q.k;
  return{score:()=>sc,
    click(x,y){if(y<330||y>470)return;const i=Math.floor((x-40)/(bw()+12));if(i<0||i>=q.k)return;
      if(i==q.a){sc++;boom(x,y,'#0f8');beep(650,.05)}else{sc=Math.max(0,sc-1);beep(120,.15);fl=.25}q=gen(R)},
    draw(t){if(fl>0){cx.fillStyle='#ff335533';cx.fillRect(0,0,800,500);fl-=.016}q.q();const w=bw();
      for(let i=0;i<q.k;i++){const b=q.b(i),x=40+i*(w+12),c=isC(b);cx.fillStyle=c?b:'#ffffff18';glow(c?b:'#00e5ff',14);cx.fillRect(x,340,w,120);cx.shadowBlur=0;if(!c)txt(b,x+w/2,415,44)}
      txt(Math.ceil(G.dur-t),740,60,40,'#ffffff30')}}}});
const gCmp=inv=>R=>{const a=10+R()*90|0;let b=10+R()*90|0;if(b==a)b++;return{k:2,a:(a>b)!=inv?0:1,b:i=>lr[i],q:()=>{txt(a,220,210,120);txt(b,580,210,120)}}};
const gPar=R=>{const a=10+R()*90|0;return{k:2,a:a%2,b:i=>['ЧЁТНОЕ','НЕЧЁТНОЕ'][i],q:()=>txt(a,400,230,150)}};
const gCnt=red=>R=>{const r=3+R()*8|0,e=red?R()*7|0:0,o=R()*4|0,D=[...Array(r+e)].map((_,i)=>[80+R()*640,90+R()*190,i<r]);

      for(let i=0;i<4;i++){const[bx,by]=pad(i),on=lit==i&&t-lt<.4;cx.fillStyle=H[i];cx.globalAlpha=on?1:.3;glow(H[i],on?30:0);cx.fillRect(bx,by,250,170);cx.globalAlpha=1;cx.shadowBlur=0}
      txt(dn?'Ошибка!':ph=='show'?'Смотри…':'Повторяй!',400,50,36);txt('Уровень '+L,730,60,24)}}}},
orbs:{n:'ОРБЫ',h:'Собирай орбы, избегай красных шаров!',fmt:s=>s+' орб.',f(R){
  const E=[0,1,2].map(()=>[R()*2+.6,R()*6,R()*2+.5,R()*6]);let sc=0,c,px=400,py=250,iv=0;const sp=t=>c={x:50+R()*700,y:50+R()*400,t0:t};sp(0);
  const ep=(e,t)=>[400+330*Math.sin(t*e[0]+e[1]),250+210*Math.cos(t*e[2]+e[3])];
  return{get x(){return px|0},get y(){return py|0},score:()=>sc,
    draw(t){px+=(Math.min(780,Math.max(20,mx))-px)*.3;py+=(Math.min(480,Math.max(20,my))-py)*.3;if(t-c.t0>2.5)sp(t);
      if(Math.hypot(c.x-px,c.y-py)<32){sc++;boom(c.x,c.y,'#0ff');beep(700+sc*20,.06);sp(t)}
      for(const e of E){const[ex,ey]=ep(e,t);circ(ex,ey,22,'#ff3355');if(t>iv&&Math.hypot(ex-px,ey-py)<32){sc=Math.max(0,sc-1);iv=t+1.2;boom(px,py,'#f55');beep(90,.3)}}
      circ(c.x,c.y,16,'#00e5ff');for(const id in pg){const p=pg[id];if(p.x!=null)circ(p.x,p.y,10,col(id)+'88')}
      cx.globalAlpha=t<iv?.4:1;circ(px,py,12,col(me));cx.globalAlpha=1;txt(Math.ceil(G.dur-t),740,60,40,'#ffffff30')}}}},
moving:{n:'МИШЕНЬ',h:'Попади по движущейся мишени!',fmt:s=>s+' поп.',f(R){
  let sc=0,p=[R()*2+1.2,R()*6,R()*2+1.2,R()*6];const at=t=>[400+330*Math.sin(t*p[0]+p[1]),250+200*Math.sin(t*p[2]+p[3])];
  return{score:()=>sc,click(x,y,t){const[tx_,ty]=at(t);if(Math.hypot(tx_-x,ty-y)<44){sc++;boom(tx_,ty,'#ff3df2');beep(500+sc*15,.06);p=[R()*2+1.2+sc*.05,R()*6,R()*2+1.2+sc*.05,R()*6]}else beep(120,.1)},
    draw(t){const[tx_,ty]=at(t);circ(tx_,ty,40,'#ff3df2');cx.strokeStyle='#fff';cx.lineWidth=4;cx.beginPath();cx.arc(tx_,ty,20,0,6.3);cx.stroke();txt(Math.ceil(G.dur-t),740,60,40,'#ffffff30')}}}},
bombs:{n:'БОМБЫ',h:'Жми синие, НЕ жми красные!',fmt:s=>s+' очк.',f(R){
  let sc=0,tg;const sp=t=>tg={x:60+R()*680,y:60+R()*380,t0:t,b:R()<.4};sp(0);
  return{score:()=>Math.max(0,sc),click(x,y,t){if(Math.hypot(x-tg.x,y-tg.y)<48){if(tg.b){sc-=2;boom(x,y,'#f55');beep(90,.3)}else{sc++;boom(x,y,'#0ff');beep(550,.05)}sp(t)}},
    draw(t){if(t-tg.t0>1)sp(t);circ(tg.x,tg.y,44,tg.b?'#ff3355':'#00e5ff');if(tg.b)txt('💣',tg.x,tg.y+14,40);txt(Math.ceil(G.dur-t),740,60,40,'#ffffff30')}}}}

};

// управление
const pos=e=>{const r=cv.getBoundingClientRect();return[(e.clientX-r.left)*800/r.width,(e.clientY-r.top)*500/r.height]};
cv.onpointermove=e=>[mx,my]=pos(e);
cv.onpointerdown=e=>{[mx,my]=pos(e);if(G&&G.run){const t=(performance.now()-G.t0)/1000;if(t>=0&&G.gm.click)G.gm.click(mx,my,t)}};
onkeydown=e=>{if(G&&G.run&&G.gm.key&&performance.now()>G.t0){G.gm.key(e.key);e.preventDefault()}};

function hud(){$('#hud').innerHTML=pls.map(p=>{const s=p.id==me?G.gm.score():(pg[p.id]&&pg[p.id].s)||0;
  return `<div class=p style="--c:${col(p.id)}"><span>${esc(p.name)}</span><b>${G.def.fmt(s)}</b></div>`}).join('')+`<div class=p style="--c:#fff">${G.i+1}/${G.n}</div>`}
let last=performance.now();
function loop(now){requestAnimationFrame(loop);const dt=Math.min(.05,(now-last)/1000);last=now;if(!G||!G.run)return;
  const t=(now-G.t0)/1000;cx.clearRect(0,0,800,500);cx.save();if(shake>.5){cx.translate((Math.random()-.5)*shake,(Math.random()-.5)*shake);shake*=.88}
  if(t<0){const c=Math.ceil(-t);if(c!=G.cd){G.cd=c;beep(520,.12)}txt(G.def.n,400,160,66,'#00e5ff');txt(G.def.h,400,225,26);txt(Math.ceil(-t),400,370,130,'#ff3df2')}
  else{if(G.cd>0){G.cd=0;beep(1040,.3)}const rm=Math.ceil(G.dur-t);if(rm<=3&&rm>0&&rm!=G.tk){G.tk=rm;beep(700,.05)}G.gm.draw(t);
    if(!G.fin&&(G.gm.done||t>=G.dur)){G.fin=1;tx({t:'done',s:G.gm.score()})}
    if(now-G.sent>100){const k=G.gm.score()+'|'+G.gm.x+'|'+G.gm.y+'|'+!G.gm.done;if(k!=G.lk||now-G.sent>1000){G.lk=k;G.sent=now;tx({t:'prog',s:G.gm.score(),x:G.gm.x,y:G.gm.y,a:!G.gm.done})}}}
  parts=parts.filter(p=>(p.l-=dt*1.6)>0);
  cx.globalCompositeOperation='lighter';for(const p of parts){p.x+=p.vx*dt;p.y+=p.vy*dt;p.vx*=.985;p.vy*=.985;cx.globalAlpha=p.l;cx.fillStyle=p.c;cx.beginPath();cx.arc(p.x,p.y,1.5+4*p.l,0,6.3);cx.fill()}cx.globalCompositeOperation='source-over';cx.globalAlpha=1;
  cx.restore();if(now-(G.h||0)>150){G.h=now;hud()}}
requestAnimationFrame(loop);
setInterval(()=>{if(G&&G.run&&!G.fin&&(performance.now()-G.t0)/1000>=G.dur){G.fin=1;tx({t:'done',s:G.gm.score()})}},500);
show('join');
</script>
